<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>City Life RP - Regolamento</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #8c469f;
    }

    /* Sfondo Responsive */
    body {
      background: 
        linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
        url('logo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      background-size: 50%; /* Default per PC */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Adattamento per Smartphone */
    @media screen and (max-width: 768px) {
      body {
        background-size: 80%; /* Logo più grande su mobile per visibilità */
        background-attachment: scroll; /* Evita distorsioni su alcuni browser mobile */
      }
      .logo-container img {
        width: 120px !important; /* Logo testata più piccolo su mobile */
      }
      .markdown-section {
        padding: 20px !important; /* Più spazio ai bordi su mobile */
      }
    }

    .logo-container {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
    .logo-container img {
      width: 180px;
      height: auto;
      transition: width 0.3s ease;
    }

    hr {
      border: 0;
      border-top: 2px solid var(--theme-color) !important;
      margin: 2em 0;
      opacity: 1;
    }

    .sidebar-nav li.active > a {
      border-right: 2px solid var(--theme-color) !important;
      color: var(--theme-color) !important;
    }
    
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: var(--theme-color);
    }

    #app {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return false">
  <div id="app">
    <div class="logo-container">
      <img src="logo.png" alt="Logo City Life">
    </div>
    Caricamento protetto...
  </div>
  
  <script>
    window.$docsify = {
      name: 'City Life RP',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'regolamento.md',
      themeColor: '#8c469f',
      logo: 'logo.png',
      auto2top: true,
      // Configurazione mobile
      mergeNavbar: true,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
    }

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's' || (e.shiftKey && e.key === 'I'))) {
        e.preventDefault();
        return false;
      }
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
