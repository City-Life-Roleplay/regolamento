<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>City Life RP - Regolamento</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #8c469f;
    }

    /* Protezione Selezione Testo e Miglioramento Font */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #fff;
      margin: 0;
      /* Colore testo nero pieno e font più leggibile */
      color: #000 !important;
      font-weight: 450; 
      font-size: 16px;
    }

    /* SFONDO FISSO (WATERMARK) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: url('logo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 50%;
      opacity: 0.12; /* Leggermente abbassata per dare priorità alla lettura */
      pointer-events: none;
    }

    /* Area Testo più leggibile */
    .markdown-section {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px;
      /* Sfondo bianco leggero per separare bene il testo dal logo di sfondo */
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
    }

    /* Rende le scritte nere e sature */
    .markdown-section p, .markdown-section li, .markdown-section table {
      color: #000 !important;
      line-height: 1.6;
    }

    /* Titoli Viola Saturi */
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: var(--theme-color) !important;
      font-weight: 700;
    }

    /* Adattamento per Smartphone */
    @media screen and (max-width: 768px) {
      body::before {
        background-size: 80%;
      }
      .logo-container img {
        width: 120px !important;
      }
      .markdown-section {
        padding: 20px 15px !important;
        background: rgba(255, 255, 255, 0.8); /* Più coprente su mobile */
      }
    }

    .logo-container {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
    .logo-container img {
      width: 180px;
      height: auto;
    }

    hr {
      border: 0;
      border-top: 2px solid var(--theme-color) !important;
      margin: 2em 0;
      opacity: 1;
    }

    .sidebar-nav li.active > a {
      border-right: 2px solid var(--theme-color) !important;
      color: var(--theme-color) !important;
      font-weight: bold;
    }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return false">
  <div id="app">
    <div class="logo-container">
      <img src="logo.png" alt="Logo City Life">
    </div>
    Caricamento...
  </div>
  
  <script>
    window.$docsify = {
      name: 'City Life RP',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'regolamento.md',
      themeColor: '#8c469f',
      logo: 'logo.png',
      auto2top: true,
      mergeNavbar: true,
    }

    /* Blocca Copia e Ispeziona */
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's' || (e.shiftKey && e.key === 'I'))) {
        e.preventDefault();
        return false;
      }
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
