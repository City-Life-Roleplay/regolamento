<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>City Life RP - Regolamento</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #8c469f;
    }

    /* Protezione e Stile Testo Alta Visibilità */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #fff;
      margin: 0;
      /* Scrittura più grande e marcata */
      color: #000 !important;
      font-weight: 600; /* Testo molto più marcato */
      font-size: 17px;
      line-height: 1.7;
    }

    /* SFONDO FISSO (WATERMARK) - Visibilità originale ripristinata */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: url('logo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 55%;
      opacity: 0.25; /* Ripristinata visibilità logo */
      pointer-events: none;
    }

    /* Area Testo senza sfondo coprente */
    .markdown-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px;
      background: transparent !important; /* Rimosso il velo bianco */
    }

    /* Miglioramento visibilità scritte nere */
    .markdown-section p, .markdown-section li, .markdown-section table {
      color: #000 !important;
      /* Leggera ombra bianca per staccare il testo dallo sfondo senza coprirlo */
      text-shadow: 0px 0px 1px #fff, 0px 0px 1px #fff;
    }

    /* Titoli Viola Molto Evidenti */
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: var(--theme-color) !important;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Adattamento per Smartphone */
    @media screen and (max-width: 768px) {
      body {
        font-size: 15px;
      }
      body::before {
        background-size: 85%;
      }
      .logo-container img {
        width: 130px !important;
      }
      .markdown-section {
        padding: 20px 15px !important;
      }
    }

    .logo-container {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
    .logo-container img {
      width: 200px;
      height: auto;
    }

    hr {
      border: 0;
      border-top: 3px solid var(--theme-color) !important;
      margin: 2.5em 0;
      opacity: 1;
    }

    .sidebar-nav li.active > a {
      border-right: 3px solid var(--theme-color) !important;
      color: var(--theme-color) !important;
      font-weight: bold;
    }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return false">
  <div id="app">
    <div class="logo-container">
      <img src="logo.png" alt="Logo City Life">
    </div>
    Caricamento...
  </div>
  
  <script>
    window.$docsify = {
      name: 'City Life RP',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'regolamento.md',
      themeColor: '#8c469f',
      logo: 'logo.png',
      auto2top: true,
      mergeNavbar: true,
    }

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's' || (e.shiftKey && e.key === 'I'))) {
        e.preventDefault();
        return false;
      }
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
